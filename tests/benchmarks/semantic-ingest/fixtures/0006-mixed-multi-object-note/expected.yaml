case_id: "0006"
slug: mixed-multi-object-note
objects:
  - id: pylon-graph
    kind: entity
    presence: required
    category:
      required: entities
      forbidden: [concepts]
    realization: page_or_update
    match:
      names: ["Pylon Graph", "pylon"]
      identifiers: ["pylon-graph", "pylon"]
    claims:
      must:
        - "Pylon Graph stores directed property graphs in an append-only log."
        - "Pylon Graph iterator yields edges in log order."
        - "Pylon Graph digest command is pylon digest --root <id> --depth 2."
      must_not:
        - "Pylon Graph shares Cragmap flag names."
        - "Pylon Graph emits the portable sorted-triple fixture."
  - id: cragmap
    kind: entity
    presence: required
    category:
      required: entities
      forbidden: [concepts]
    realization: page_or_update
    match:
      names: ["Cragmap", "cragmap"]
      identifiers: ["cragmap"]
    claims:
      must:
        - "Cragmap stores the graph model as a memory-mapped adjacency table."
        - "Cragmap iterator yields edges in packed CSR order."
        - "Cragmap hash command is cragmap hash-sub --node <id> --hops 2 --order csr."
      must_not:
        - "Cragmap and Pylon Graph are one combined tool page."
        - "Cragmap emits the portable sorted-triple fixture."
  - id: subgraph-digest-order-sensitivity
    kind: concept
    presence: required
    category:
      required: concepts
      forbidden: [entities]
    realization: page_or_update
    match:
      names: ["Subgraph digest", "Subgraph digest mismatch", "Subgraph digest order sensitivity", "iterator-order digest mismatch"]
      identifiers: ["subgraph-digest", "subgraph-digest-order-sensitivity", "iterator-order-digest"]
    claims:
      must:
        - "A subgraph digest that hashes neighbor ids in iterator order will not match between Pylon Graph and Cragmap."
        - "Pylon Graph log order and Cragmap packed CSR order are the iterator-order mismatch."
      must_not:
        - "A generic graph database concept is the primary object."
  - id: portable-subgraph-fixture
    kind: idea
    presence: required
    category:
      required: ideas
      forbidden: [entities, concepts]
    realization: page_or_update
    match:
      names: ["Portable subgraph fixture", "sorted-triple fixture"]
      identifiers: ["portable-subgraph-fixture", "sorted-triple-fixture"]
    claims:
      must:
        - "The portable fixture is not implemented."
        - "The proposed format is newline-delimited sorted triples plus a schema header."
        - "Neither repo has a fixture emitter."
      must_not:
        - "Either tool currently emits the portable fixture."
  - id: graph-databases-dump
    kind: concept
    presence: forbidden
    category:
      required: concepts
    realization: must_not_page
    match:
      names: ["Graph databases", "Graph database notes"]
      identifiers: ["graph-databases"]
    claims:
      must: []
      must_not: []
    reason: "This fixture exists to detect under-splitting."
