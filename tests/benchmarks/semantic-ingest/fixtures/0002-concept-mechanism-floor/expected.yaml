objects:
  - id: lease-fencing
    kind: concept
    presence: required
    category:
      required: concepts
      forbidden: [entities]
    realization: page_or_update
    match:
      names: ["Lease fencing", "Fenced writes"]
      identifiers: ["lease-fencing", "fenced-writes"]
    claims:
      must:
        - "Mutations carry a monotonic fence."
        - "Storage rejects mutations whose fence is older than the last accepted fence."
        - "Lease expiry alone is not safety; acquisition writes fence+1 with compare-and-set."
        - "A fence stays in the log, unlike a mutex that disappears when the process dies."
      must_not:
        - "Harborline or Foldgate is the primary object."
        - "Lease timeout alone prevents stale writes."
        - "Poisoning is required for lease fencing."
